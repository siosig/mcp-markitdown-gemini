[package]
name = "markitdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Convert documents (PDF, Office, HTML, etc.) at a URI to Markdown."

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
calamine = "0.35.0"
chardetng = "1.0.0"
csv = "1.4.0"
data-url = "0.3.2"
encoding_rs = "0.8.35"
epub = "2.1.5"
htmd = "0.5.4"
infer = "0.19.0"
kamadak-exif = "0.6.1"
pdf-extract = "0.12.0"
quick-xml = "0.40.1"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "rustls", "gzip"] }
scraper = "0.27.0"
serde_json = "1.0.150"
thiserror = "2.0.18"
tracing = "0.1.44"
url = "2.5.8"
zip = "7.2.0"

[dev-dependencies]
