[workspace]
resolver = "2"
members = ["crates/markitdown", "crates/markitdown-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.88 is the MSRV of gemini-genai 0.2 (the Gemini SDK used for PDF conversion).
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/siosig/mcp-markitdown-gemini"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
